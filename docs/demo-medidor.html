<title>Pasto · Medidor (demostración)</title>
<style>:root{--verde-oscuro: #1b5e20;--verde: #2e7d32;--verde-claro: #e8f5e9;--tinta: #12210f;--fondo: #f5f7f2;--blanco: #ffffff;--gris: #6b7280;--borde: #d3ddd0;--alerta: #b45309;--rojo: #b91c1c}*{box-sizing:border-box;margin:0;padding:0}html,body,#raiz{height:100%}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:17px}.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}.cabecera{background:var(--verde-oscuro);color:var(--blanco);padding:14px 16px calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:baseline}.cabecera h1{font-size:20px;font-weight:700}.cabecera .campo{font-size:14px;opacity:.9}.contenido{flex:1;overflow-y:auto;padding:14px 14px 90px}.banda-sync{padding:8px 16px;font-size:14px;font-weight:600;text-align:center}.banda-sync.pendiente{background:#fef3c7;color:var(--alerta)}.banda-sync.ok{background:var(--verde-claro);color:var(--verde-oscuro)}.banda-sync.offline{background:#e5e7eb;color:#374151}.tarjeta{background:var(--blanco);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}.tarjeta h2{font-size:16px;color:var(--verde-oscuro);margin-bottom:2px}.tarjeta .sub{font-size:13px;color:var(--gris);margin-bottom:8px}.fila-punto{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:14px 12px;margin-top:8px;background:var(--fondo);border:1px solid var(--borde);border-radius:12px;font-size:17px;font-weight:600;color:var(--tinta);cursor:pointer;min-height:60px}.fila-punto:active{background:var(--verde-claro)}.fila-punto .estado{font-size:14px;font-weight:600;color:var(--gris)}.fila-punto.medido{border-color:var(--verde)}.fila-punto.medido .estado{color:var(--verde)}.titulo-seccion{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris);margin:16px 4px 6px}.pantalla-punto{display:flex;flex-direction:column;gap:10px;height:100%}.visor{background:var(--blanco);border:2px solid var(--verde);border-radius:14px;padding:12px 16px;text-align:center}.visor .altura{font-size:52px;font-weight:800;line-height:1.1}.visor .unidad{font-size:20px;color:var(--gris);font-weight:600}.visor .equivalencia{font-size:16px;color:var(--verde-oscuro);font-weight:700;margin-top:2px}.visor .lecturas{font-size:13px;color:var(--gris);margin-top:6px;word-wrap:break-word}.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.teclado button{font-size:28px;font-weight:700;min-height:64px;background:var(--blanco);color:var(--tinta);border:1px solid var(--borde);border-radius:12px;cursor:pointer}.teclado button:active{background:var(--verde-claro)}.boton{display:block;width:100%;min-height:60px;font-size:19px;font-weight:700;border-radius:12px;cursor:pointer;border:1px solid var(--borde)}.boton.primario{background:var(--verde);color:var(--blanco);border-color:var(--verde)}.boton.primario:active{background:var(--verde-oscuro)}.boton.secundario{background:var(--blanco);color:var(--verde-oscuro)}.boton.suave{background:var(--fondo);color:var(--tinta);font-weight:600;font-size:16px;min-height:52px}.boton:disabled{opacity:.45;cursor:default}.fila-botones{display:flex;gap:8px}.fila-botones .boton{flex:1}label.etiqueta{display:block;font-size:14px;font-weight:700;color:var(--gris);margin:12px 2px 4px}input.entrada,select.entrada,textarea.entrada{width:100%;font-size:18px;padding:14px 12px;border:1px solid var(--borde);border-radius:12px;background:var(--blanco);color:var(--tinta)}.alternar{display:flex;gap:8px}.alternar button{flex:1;min-height:60px;font-size:18px;font-weight:700;border:2px solid var(--borde);border-radius:12px;background:var(--blanco);color:var(--gris);cursor:pointer}.alternar button.activo{border-color:var(--verde);background:var(--verde-claro);color:var(--verde-oscuro)}.aviso-ok{background:var(--verde-claro);color:var(--verde-oscuro);border-radius:12px;padding:12px;font-weight:700;text-align:center;margin-bottom:10px}.aviso-error{background:#fee2e2;color:var(--rojo);border-radius:12px;padding:12px;font-weight:600;margin-bottom:10px}.nota{font-size:13px;color:var(--gris);margin-top:8px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;max-width:560px;margin:0 auto;background:var(--blanco);border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom,0px)}.nav button{flex:1;min-height:64px;font-size:15px;font-weight:700;background:none;border:none;color:var(--gris);cursor:pointer}.nav button.activo{color:var(--verde-oscuro)}.nav .icono{display:block;font-size:22px;line-height:1.2}.kpi{display:flex;gap:10px}.kpi .celda{flex:1;background:var(--blanco);border:1px solid var(--borde);border-radius:12px;padding:10px;text-align:center}.kpi .valor{font-size:26px;font-weight:800;color:var(--verde-oscuro)}.kpi .rotulo{font-size:12px;color:var(--gris)}
